name: Browser

# The gate CLAUDE.md calls the one that matters most, and the only one that had
# never run anywhere but a laptop.
#
# Everything in `CI` reads source or generates forms with Joomla replaced by a
# couple of constants; none of it boots the framework. What only a browser can
# say here is whether a modelled language opens, exports and imports on a real
# Joomla - and whether a saved one still has its entities afterwards.
#
# It is a separate workflow rather than more steps in `CI` because it is the
# slow one and because it can fail for reasons that are about the runner rather
# than the code. Keeping it apart means a red browser run is legible as itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cypress:
    runs-on: ubuntu-latest

    services:
      # Joomla's installer wants a database that already exists; MYSQL_DATABASE
      # makes it. The credentials are this container's and live nowhere else.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: joomla
          MYSQL_DATABASE: joomla_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pjoomla"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      JOOMLA_VERSION: 6.1.3
      SITE_URL: http://127.0.0.1:8080
      # A Super User for this run only. Joomla requires twelve characters.
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-password-for-one-run

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # What Joomla asks for, plus zip for the packages this component
          # builds and unpacks.
          extensions: zip, mysqli, pdo_mysql, intl, gd, mbstring, simplexml
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Cypress itself, from the lockfile. Its binary is a separate download
      # that npm fetches on install; the npm cache above keeps the packages
      # between runs.
      - name: Install Cypress
        run: npm ci

      - name: Fetch Joomla
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla

      # Joomla's own CLI installer, which is why the *full* package is fetched
      # above: `installation/` is only in that one, and it removes itself when
      # it is done.
      - name: Install Joomla
        run: |
          php joomla/installation/joomla.php install \
            --site-name="Meta-gen CI" \
            --admin-user="CI" \
            --admin-username="${ADMIN_USERNAME}" \
            --admin-password="${ADMIN_PASSWORD}" \
            --admin-email="ci@example.invalid" \
            --db-type=mysqli \
            --db-host=127.0.0.1 \
            --db-user=root \
            --db-pass=joomla \
            --db-name=joomla_ci \
            --db-prefix=ci_ \
            --no-interaction

      # Joomla works out its own root from the request, and under PHP's built-in
      # server it gets it wrong: a request to /administrator/index.php leaves it
      # believing the site root *is* /administrator, so every admin redirect
      # comes back as /administrator/administrator/index.php and 404s. The login
      # succeeds and the page it lands on does not exist.
      #
      # `$live_site` is the override Joomla provides for exactly this: when it is
      # set, nothing is detected. Pinned to the address this run serves on, which
      # is the address Cypress is pointed at below.
      - name: Tell Joomla where it lives
        run: |
          sed -i "s|public \$live_site = '';|public \$live_site = '${SITE_URL}';|" joomla/configuration.php
          # And say what went wrong when something does. A fresh Joomla has
          # debug off, so its error page is a polite sentence with nothing in it.
          sed -i "s|public \$debug = false;|public \$debug = true;|" joomla/configuration.php

          grep -q "live_site = '${SITE_URL}'" joomla/configuration.php || {
            echo "live_site was not set - the default line has changed shape"
            grep -n live_site joomla/configuration.php
            exit 1
          }

      # Joomla logs an uncaught exception - the one behind a bare 500 - under
      # the category `error`, and only `log_everything` gives that category a
      # logger. Without it a run that failed with a 500 left no message at all:
      # PHP's server log sees a status code, not what Joomla caught.
      #
      # Added to the configuration class rather than set with `config:set`,
      # which only changes options the file already has, and a fresh install
      # does not write this one. Then read back, so a change in the file's
      # shape fails here rather than leaving the next 500 silent again.
      - name: Make Joomla write down its errors
        run: |
          php -r '$f = $argv[1]; $s = file_get_contents($f); $p = strrpos($s, "}"); file_put_contents($f, substr($s, 0, $p) . "\tpublic \$log_everything = 1;\n" . substr($s, $p));' joomla/configuration.php
          php joomla/cli/joomla.php config:get log_everything | grep -qE 'log_everything +1' || {
            echo 'log_everything is not on'
            php joomla/cli/joomla.php config:get log_everything
            exit 1
          }

      # PHP's own server, with workers: a single-threaded one deadlocks the
      # moment a page asks the site for a second thing while the first is still
      # being served, which the generated front end does.
      # `display_errors=stderr`, not `1`. On the CLI server `1` writes PHP
      # notices into the HTTP response: pages that were fine came back broken,
      # a generated front end 500ed and `cy.request()` got a deprecation
      # notice where a package should have been. `stderr` puts them in the log
      # this job keeps, which is where they were wanted in the first place.
      #
      # And the level is left alone. `error_reporting=-1` looked harmless and
      # was not: Joomla's handler throws an ErrorException for anything inside
      # the current level, so raising it turned every deprecation in older
      # code into a 500. Exten-gen went from 39 of 39 to failures in the
      # generated front end and an export request, with nothing of its own
      # changed. PHP's default level already reports the warnings and fatals
      # this is here to catch - it is what found the Meta-gen bug.
      #
      # The opcode cache is left at its defaults, as on a real site. Nothing a
      # spec does may install from outside this server: Joomla clears the cache
      # for the files an install writes in the process that writes them, so an
      # install through the CLI left this server running the old namespace map
      # for up to two seconds, and the first request to the new component 500ed.
      - name: Serve the site
        run: |
          PHP_CLI_SERVER_WORKERS=4 php -d display_errors=stderr -S 127.0.0.1:8080 -t joomla > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "${SITE_URL}/administrator/"; then
              echo "serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the site never came up"
          cat php-server.log
          exit 1

      # Git-ignored, because on a laptop it holds a real login. Here it holds
      # the throwaway one this run just created.
      - name: Point Cypress at it
        run: |
          cat > cypress.env.json <<JSON
          {
            "baseUrl": "${SITE_URL}",
            "adminUser": "${ADMIN_USERNAME}",
            "adminPassword": "${ADMIN_PASSWORD}"
          }
          JSON

      # Builds the package and installs it through Joomla's CLI, the way a real
      # install works.
      - name: Install the component
        run: composer install-local

      # A fresh Joomla starts a guided tour at the admin, and a tour navigates:
      # two seconds after a spec opens a list, the browser is on the Home
      # Dashboard and every element the spec was about has gone. It is the
      # single reason most of these failed - reference-fields went from 0 of 4
      # to 4 of 4, and from a minute to fifteen seconds, with this one line.
      #
      # The statistics plugin goes too. It asks the administrator a question on
      # first sight, which is a dialog over the page under test.
      #
      # A development site has had both dealt with long ago, which is exactly
      # why neither showed up until this ran somewhere clean.
      - name: Quieten a fresh Joomla
        run: |
          mysql -h 127.0.0.1 -uroot -pjoomla joomla_ci -e "UPDATE ci_extensions SET enabled = 0 WHERE type = 'plugin' AND element IN ('guidedtours', 'stats');"

      # ER1 is what most of these open; LionCore M3 is the language that
      # describes languages, which the forms generator and the export specs
      # need. The specs re-seed and forget as they go, and say so where they do.
      - name: Seed the languages
        run: |
          php tools/seed-metalanguage.php
          php tools/seed-metalanguage.php lioncore-m3

      - name: Browser tests
        run: npx cypress run

      - name: What it saw when it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      # Not a tail: the interesting line is usually in the first spec and a
      # tail shows the last one's asset requests. The whole log goes up as an
      # artifact too, because a grep only finds what it was told to look for.
      - name: What Joomla logged
        if: failure()
        run: |
          grep -ahE 'CRITICAL|ERROR' joomla/administrator/logs/*.php | cut -c1-2000 | head -40 || true

      - name: Joomla's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: joomla-logs
          path: joomla/administrator/logs
          if-no-files-found: ignore

      - name: What the server said
        if: failure()
        run: |
          echo '--- anything that looks like a failure ---'
          grep -inE 'fatal|uncaught|exception|error|warning|\[500\]' php-server.log | head -50 || true
          echo '--- last 30 lines ---'
          tail -30 php-server.log

      # The server log carries the warnings that lead up to a 500 but not the
      # exception itself: Joomla catches that and renders it into the page, and
      # `cy.visit` aborts on the status before it can read the body. So the page
      # is fetched here, signed in, the way the spec would have seen it.
      - name: What the failing page actually said
        if: failure()
        run: |
          jar=$(mktemp)
          token=$(curl -s -c "$jar" "${SITE_URL}/administrator/index.php" \
            | grep -oE 'name="[0-9a-f]{32}" value="1"' | head -1 | grep -oE '[0-9a-f]{32}')
          echo "token: ${token:-none found}"
          curl -s -b "$jar" -c "$jar" -o /dev/null \
            --data-urlencode "username=${ADMIN_USERNAME}" \
            --data-urlencode "passwd=${ADMIN_PASSWORD}" \
            -d "option=com_login&task=login&${token}=1" \
            "${SITE_URL}/administrator/index.php"
          curl -s -b "$jar" \
            "${SITE_URL}/administrator/index.php?option=com_metagen&view=generateForms&tmpl=component&metalanguage_id=1" \
            -o failing-page.html

          echo '--- the page the spec could not read ---'
          # Style and script blocks first: the error page is mostly inline CSS,
          # and stripping tags without removing those leaves the message buried
          # under it - which is how the last attempt printed forty lines of
          # custom properties and no error.
          sed -e '/<style/,/<\/style>/d' -e '/<script/,/<\/script>/d' failing-page.html \
            | sed -e 's/<[^>]*>/ /g' -e 's/&nbsp;/ /g' -e 's/  */ /g' \
            | grep -vE '^[[:space:]]*$' | head -60

      # And the page itself, because a filter only finds what it was told to.
      - name: The failing page
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-page
          path: failing-page.html
          if-no-files-found: ignore

      - name: The whole server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: php-server.log
          if-no-files-found: ignore
