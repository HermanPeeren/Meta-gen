name: Release

# Pushing a tag is the whole release procedure. PhpStorm can create and push a
# tag from the Git menu, so nothing here needs a terminal.
#
# Ported from Exten-gen, which learned it the hard way: a tag pushed to a
# repository with nothing listening for it produces no release, no failure and
# no mail at all.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Three versions have to agree, and only one of them is edited by hand.
      # The tag is checked against the manifest here; updates.xml is checked by
      # regenerating it below.
      - name: The tag must match the manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(php -r 'echo trim((string) simplexml_load_file("src/metagen.xml")->version);')
          echo "tag: $TAG   manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the manifest version $MANIFEST. Bump src/metagen.xml, or tag the version it already carries."
            exit 1
          fi

      # updates.xml is what an installed site reads to learn a new version
      # exists, and it points at a release asset by name. A stale one either
      # hides this release or offers a download that 404s, and neither shows up
      # in any test. It is generated, so the check is that regenerating changes
      # nothing.
      - name: The update server must be current
        run: |
          php build/update-xml.php
          if ! git diff --quiet; then
            echo "::error::updates.xml is out of date. Run php build/update-xml.php, commit the result, and re-tag."
            git --no-pager diff
            exit 1
          fi

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit tests
        run: composer test

      - name: Browser-side tests
        run: composer test-js

      # PHPStan resolves the component's base classes against a real Joomla.
      # Without it every `extends AdminModel` is an unknown class and the
      # analysis says nothing. /joomla is git-ignored, so CI fetches its own.
      - name: Fetch Joomla for static analysis
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.3

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs

      # No --no-library here. There is no sibling checkout on a runner, so the
      # build fetches the library release that script.php insists on - which is
      # the point: what ships is the artefact that was published and verified,
      # and a release needing a library nobody published fails here rather than
      # on somebody's site.
      - name: Build the package
        run: php build/build.php

      # The package is what people install, so its contents are asserted once
      # rather than the build script being trusted forever.
      - name: The package must be installable and carry nothing it should not
        run: |
          php -r '
            $zip = new ZipArchive();
            $zip->open(glob("build/com_metagen-*.zip")[0]);

            $names = [];
            for ($i = 0; $i < $zip->numFiles; $i++) {
                $names[] = $zip->getNameIndex($i);
            }

            // Working directories the build has no reason to reach into, and
            // Windows separators, which unzip on a server as one long filename.
            $bad = array_values(array_filter($names, static fn (string $n): bool =>
                str_contains($n, "/generated/")
                || str_contains($n, "/compilation_cache/")
                || str_contains($n, "node_modules/")
                || str_contains($n, "\\")));

            if ($bad !== []) {
                fwrite(STDERR, "Package contains files it should not:\n  " . implode("\n  ", $bad) . "\n");
                exit(1);
            }

            // What Joomla needs before it can install anything at all.
            foreach (["metagen.xml", "script.php"] as $required) {
                if (!in_array($required, $names, true)) {
                    fwrite(STDERR, "Package has no {$required}.\n");
                    exit(1);
                }
            }

            // And the library, without which an installed component cannot
            // generate. script.php installs it from exactly here.
            $library = array_filter(
                $names,
                static fn (string $n): bool => str_starts_with($n, "library/") && str_ends_with($n, ".zip")
            );

            if ($library === []) {
                fwrite(STDERR, "Package carries no library. A site installing this could not generate.\n");
                exit(1);
            }

            echo "package holds " . count($names) . " files, none of them unwanted\n";
          '

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/com_metagen-*.zip \
            --title "Meta-gen $GITHUB_REF_NAME" \
            --generate-notes
