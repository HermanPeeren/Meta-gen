name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Unit tests
        run: composer test

      # PHPStan resolves the form fields against a real Joomla. Without it every
      # `extends ListField` is an unknown class and the analysis says nothing.
      # /joomla is git-ignored, so CI fetches its own.
      - name: Fetch Joomla for static analysis
        run: |
          url="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA_VERSION}/Joomla_${JOOMLA_VERSION}-Stable-Full_Package.tar.gz"
          curl -sSL -o joomla.tar.gz "$url"
          mkdir -p joomla
          tar -xzf joomla.tar.gz -C joomla
        env:
          JOOMLA_VERSION: 6.1.3

      - name: Static analysis
        run: composer analyse

      - name: Coding standards
        run: composer cs
